services:
  web:
    build: .
    image: stock_scanner_app:latest
    container_name: stock_scanner_web
    restart: always
    env_file:
      - .env
    environment:
      - SCAN_DATA_DIR=/app/scan_data
      - SKIP_BOT_THREAD=true
      - ALLOW_DELAYED_OPTIONS_TRADING=true
      - ALERT_METHOD=TELEGRAM
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - ./conf:/app/conf
      - scan_data:/app/scan_data
    command: gunicorn app:app --bind 0.0.0.0:5000 --timeout 600 --workers 1 --threads 8 --keep-alive 5

  indicator_bot:
    image: stock_scanner_app:latest
    container_name: stock_scanner_bot
    restart: always
    env_file:
      - .env
    environment:
      - SCAN_DATA_DIR=/app/scan_data
      - EARLIEST_TRADE_TIME_MINS=580
      - LATEST_TRADE_TIME_MINS=930
      - ALLOW_DELAYED_OPTIONS_TRADING=true
      - EXECUTE_TEST_TRADE_ON_START=true
      - TEST_TRADE_AUTO_CLOSE_SECS=60
      - ALERT_METHOD=TELEGRAM
    volumes:
      - ./conf:/app/conf
      - scan_data:/app/scan_data
    command: python indicator_bot.py
    depends_on:
      - web

volumes:
  scan_data:
