version: '3.8'

services:
  web:
    build: .
    container_name: stock_scanner_web
    restart: always
    env_file:
      - .env
    ports:
      - "5000:5000"
    command: gunicorn app:app --bind 0.0.0.0:5000 --timeout 600 --workers 2

  indicator_bot:
    build: .
    container_name: stock_scanner_bot
    restart: always
    env_file:
      - .env
    command: python indicator_bot.py
