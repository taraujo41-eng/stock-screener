services:
  web:
    build: .
    image: stock_scanner_app:latest
    container_name: stock_scanner_web
    restart: always
    env_file:
      - .env
    environment:
      - SCAN_DATA_DIR=/app/scan_data
      - SKIP_BOT_THREAD=true
    ports:
      - "5000:5000"
    volumes:
      - ./conf:/app/conf
      - scan_data:/app/scan_data
    command: gunicorn app:app --bind 0.0.0.0:5000 --timeout 600 --workers 1 --threads 4

  indicator_bot:
    image: stock_scanner_app:latest
    container_name: stock_scanner_bot
    restart: always
    env_file:
      - .env
    environment:
      - SCAN_DATA_DIR=/app/scan_data
    volumes:
      - ./conf:/app/conf
      - scan_data:/app/scan_data
    command: python indicator_bot.py
    depends_on:
      - web

volumes:
  scan_data:
