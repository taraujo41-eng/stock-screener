name: Oracle Cloud Health Check

on:
  schedule:
    # Runs every 15 minutes during market hours, Mon-Fri (13:00 - 21:00 UTC)
    - cron: '*/15 13-20 * * 1-5'
  workflow_dispatch: # Allow manual trigger

jobs:
  health_check:
    runs-on: ubuntu-latest
    steps:
      - name: Health Check Oracle Cloud Service
        env:
          SERVER_URL: ${{ secrets.ORACLE_APP_URL }}
        run: |
          if [ -z "$SERVER_URL" ]; then
            echo "ℹ️ No ORACLE_APP_URL secret set in GitHub repository settings. Skipping ping."
            exit 0
          fi
          echo "Pinging Oracle Cloud service at $(date -u)..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 30 \
            "${SERVER_URL}/api/ping")
          echo "Response status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 400 ]; then
            echo "✅ Service is online and healthy"
          else
            echo "⚠️ Service returned $HTTP_STATUS"
          fi
