name: Check Bot Status

on:
  workflow_dispatch:

jobs:
  check_status:
    runs-on: ubuntu-latest
    steps:
      - name: Check Status on Oracle Cloud via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST || '129.153.190.111' }}
          username: ${{ secrets.SERVER_USER || 'ubuntu' }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            echo "=== DOCKER CONTAINER STATUS ==="
            docker ps
            echo "=== PAPER TRADER STATUS ==="
            docker exec stock_scanner_web curl -s http://127.0.0.1:5000/api/paper/status || true
            echo ""
            echo "=== OPEN POSITIONS ==="
            docker exec stock_scanner_web curl -s http://127.0.0.1:5000/api/paper/positions || true
            echo ""
            echo "=== WEBULL SESSION STATUS & REFRESH ==="
            docker exec stock_scanner_web curl -s --max-time 10 -X POST http://127.0.0.1:5000/api/webull/refresh || true
            echo ""
            docker exec stock_scanner_web curl -s --max-time 10 http://127.0.0.1:5000/api/webull/status || true
            echo ""
            echo "=== BOT LOGS (LAST 80 LINES) ==="
            docker logs --tail 80 stock_scanner_bot
